# External strategy certification catalog.
#
# The registry refuses to register any implementation that is absent here or
# whose version, implementation class, enabled flag, model, compatibility tuple
# or execution-option tuple differs from this file.  A plugin cannot promote
# itself by declaring VERIFIED in its own StrategySpec.
#
# Status is copied from docs/STRATEGY_CATALOG.md, which remains the evidence
# document.  There is exactly one enabled baseline and one enabled non-Native
# strategy.  The non-Native strategy is applicable only when the caller
# explicitly declares an immutable dataset epoch.
schema_version: 1

strategies:
  - strategy_id: S0_NATIVE
    version: "0.1.0"
    database_model: tree
    compatible_server_versions: ["2.0.6"]
    enabled: true
    verification_status: VERIFIED
    is_baseline: true
    selection_policy: lowest_cost
    implementation_class: tsdb_optimizer.strategies.native.NativeStrategy
    allowed_execution_options: []
    proof_entry: docs/STRATEGY_CATALOG.md#31-入口证明
    proof_correctness: docs/STRATEGY_CATALOG.md#32-正确性定义
    proof_effect: docs/STRATEGY_CATALOG.md#33-生效与收益
    proof_benefit: docs/STRATEGY_CATALOG.md#33-生效与收益
    proof_fallback: docs/STRATEGY_CATALOG.md#34-回退证明
    reason: "baseline and fallback; no optimization or plan effect is claimed"

  - strategy_id: S1_REPEAT_CACHE
    version: "1.0.0"
    database_model: tree
    compatible_server_versions: ["2.0.6"]
    enabled: true
    verification_status: VERIFIED
    is_baseline: false
    selection_policy: repeat_cache
    implementation_class: tsdb_optimizer.strategies.repeat_cache.RepeatCacheStrategy
    allowed_execution_options: ["cache_epoch"]
    proof_entry: docs/STRATEGY_CATALOG.md#s1-repeat-cache-入口证明
    proof_correctness: docs/STRATEGY_CATALOG.md#s1-repeat-cache-正确性
    proof_effect: docs/STRATEGY_CATALOG.md#s1-repeat-cache-生效证明
    proof_benefit: docs/STRATEGY_CATALOG.md#s1-repeat-cache-收益证明
    proof_fallback: docs/STRATEGY_CATALOG.md#s1-repeat-cache-回退证明
    reason: "process-local exact-SQL cache under a caller-declared immutable epoch; EXACT_SQL_NO_REWRITE needs no parser rewrite; no server-side invalidation is claimed"

